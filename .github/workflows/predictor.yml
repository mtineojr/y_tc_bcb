name: TC Predictor v2 — Corrida Manual

on:
  workflow_dispatch:

jobs:
  predecir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install pandas numpy requests

      - name: Correr predictor
        env:
          DOLARBLUE_API_KEY: ${{ secrets.DOLARBLUE_API_KEY }}
        run: python predictor/predictor.py

      - name: Commit y push de resultados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ docs/
          git diff --cached --quiet || git commit -m "Predicción TC v2: $(date -u '+%Y-%m-%d %H:%M') [manual]"
          git push
